<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live aircraft and significant marine traffic around Tallinn, Estonia."
    />
    <meta name="theme-color" content="#dce8ec" />
    <script>
      (() => {
        let theme = 'light'
        try {
          if (localStorage.getItem('livetrafficstan.theme') === 'dark') {
            theme = 'dark'
          }
        } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#07131d' : '#dce8ec')
      })()
    </script>
    <title>LiveTrafficStan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
