name: Prepare TrackStan domain

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA containing the domain preparation
        required: true
        type: string
      remove_parking_records:
        description: Remove only the two known imported apex parking A values
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Validate exact-main request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main and successful validation
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "validate" and .app.slug == "github-actions")] | sort_by(.id) | last | .conclusion')"
          if [[ "$conclusion" != success ]]; then
            echo "Exact-current-main validate must pass before domain preparation." >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare fixed zone and optional parking cleanup
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          REMOVE_PARKING_RECORDS: ${{ inputs.remove_parking_records }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-trackstan-zone.mjs
