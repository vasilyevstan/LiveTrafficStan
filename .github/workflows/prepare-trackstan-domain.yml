name: Prepare TrackStan domain

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA containing the site preparation
        required: true
        type: string
      operation:
        description: Fixed domain, analytics or object-sharing storage operation
        required: true
        default: domain
        type: choice
        options:
          - domain
          - web-analytics
          - web-analytics-read
          - web-analytics-statistics
          - object-sharing-setup
      remove_parking_records:
        description: Remove only the two known imported apex parking A values
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Validate exact-main request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          OPERATION: ${{ inputs.operation || 'domain' }}
          REMOVE_PARKING_RECORDS: ${{ inputs.remove_parking_records }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          [[ "$OPERATION" == domain || "$OPERATION" == web-analytics || "$OPERATION" == web-analytics-read || "$OPERATION" == web-analytics-statistics || "$OPERATION" == object-sharing-setup ]]
          if [[ "$OPERATION" != domain ]]; then
            test "$REMOVE_PARKING_RECORDS" = false
          fi

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main and successful validation
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "validate" and .app.slug == "github-actions")] | sort_by(.id) | last | .conclusion')"
          if [[ "$conclusion" != success ]]; then
            echo "Exact-current-main validate must pass before domain preparation." >&2
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Prepare fixed zone and optional parking cleanup
        if: inputs.operation == 'domain'
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          REMOVE_PARKING_RECORDS: ${{ inputs.remove_parking_records }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-trackstan-zone.mjs

      - name: Prepare fixed manual Web Analytics site
        if: inputs.operation == 'web-analytics' || inputs.operation == 'web-analytics-read' || inputs.operation == 'web-analytics-statistics'
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          ANALYTICS_READ_ONLY: ${{ inputs.operation != 'web-analytics' }}
          ANALYTICS_VERIFY_STATISTICS: ${{ inputs.operation == 'web-analytics-statistics' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-trackstan-analytics.mjs

      - name: Prepare fixed object-sharing storage
        if: inputs.operation == 'object-sharing-setup'
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          OBJECT_SHARE_OPERATION: setup
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/prepare-object-sharing.mjs
