name: Qualify Space-Track basic data

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main SHA for one fixed GP contract probe
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate qualification request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Check out exact main source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test qualification boundaries
        run: npx vitest run scripts/probe-space-track.test.mjs

      - name: Respect earlier source attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/qualify-space-track.yml/runs?per_page=10" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .head_branch == \"main\") | .id")"
          count=0
          for run in $previous; do
            count=$((count + 1))
            attempted="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=all&per_page=100" \
              --jq 'if .total_count == 0 or .total_count > 100 then error("Probe job history is incomplete") else [.jobs[].steps[]? | select(.name == "Run bounded GP contract probe" and .started_at != null and .conclusion != "skipped")] | length end')"
            if [[ "$attempted" != 0 ]]; then
              gh run download "$run" --repo "$GITHUB_REPOSITORY" \
                --name space-track-contract-receipt --dir "$RUNNER_TEMP/prior-space-track"
              node scripts/probe-space-track.mjs \
                --check-prior "$RUNNER_TEMP/prior-space-track/space-track-contract.json"
              break
            fi
            if [[ "$count" == 9 ]]; then
              echo "Probe history is incomplete; investigate before another request." >&2
              exit 1
            fi
          done

      - name: Verify exact current main immediately before access
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Run bounded GP contract probe
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          SPACE_TRACK_USERNAME: ${{ secrets.SPACE_TRACK_USERNAME }}
          SPACE_TRACK_PASSWORD: ${{ secrets.SPACE_TRACK_PASSWORD }}
        run: node scripts/probe-space-track.mjs --output "$RUNNER_TEMP/space-track-contract.json"

      - name: Preserve sanitized contract receipt
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: space-track-contract-receipt
          path: ${{ runner.temp }}/space-track-contract.json
          if-no-files-found: ignore
          retention-days: 30
