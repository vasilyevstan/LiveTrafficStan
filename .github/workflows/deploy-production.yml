name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main commit SHA to deploy
        required: true
        type: string
      artifact:
        description: Application or one-time PWA retirement artifact
        required: true
        default: application
        type: choice
        options:
          - application
          - pwa-retirement
      aircraft_photo_enabled:
        description: Enable direct Planespotters aircraft photos in the client
        required: true
        default: false
        type: boolean
      aircraft_delivery:
        description: Aircraft delivery path used by the browser
        required: true
        default: worker-proxy
        type: choice
        options:
          - worker-proxy
          - adsb-lol-direct
      flight_route_enabled:
        description: Enable direct ADSB.lol plausible-route lookup
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      WRANGLER_SEND_METRICS: false

    steps:
      - name: Validate deployment request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The deployment SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Check vessel photos
        run: npm run check:vessel-photos

      - name: Build application
        if: inputs.artifact == 'application'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
        run: npm run build

      - name: Build PWA retirement artifact
        if: inputs.artifact == 'pwa-retirement'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
        run: npm run build:pwa-retire

      - name: Check exact deployment bundle
        run: npm run check:deploy

      - name: Deploy exact source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            git fetch --no-tags origin main
            test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
            test "$(git rev-parse origin/main)" = "${{ inputs.sha }}"
          command: >-
            deploy
            --var RELEASE_SHA:${{ inputs.sha }}

      - name: Smoke deployed application
        run: >-
          node scripts/smoke-production.mjs
          "${{ steps.deploy.outputs.deployment-url }}"
          "${{ inputs.sha }}"
          "${{ inputs.aircraft_delivery }}"

      - name: Record deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "### LiveTrafficStan production deployment"
            echo
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- Artifact: \`${{ inputs.artifact }}\`"
            echo "- Aircraft delivery: \`${{ inputs.aircraft_delivery }}\`"
            echo "- Aircraft photos enabled: \`${{ inputs.aircraft_photo_enabled }}\`"
            echo "- Flight route lookup enabled: \`${{ inputs.flight_route_enabled }}\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag rollback requirement
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Deployment completed but smoke failed. Distinguish a provider outage from a release regression; for a release regression, restore the recorded prior Cloudflare version and rerun the smoke."
