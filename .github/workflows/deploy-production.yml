name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      WRANGLER_SEND_METRICS: false

    steps:
      - name: Validate deployment request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The deployment SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Check deployment bundle
        run: npm run check:deploy

      - name: Deploy exact source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            git fetch --no-tags origin main
            test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
            test "$(git rev-parse origin/main)" = "${{ inputs.sha }}"
          command: deploy --var RELEASE_SHA:${{ inputs.sha }}

      - name: Smoke deployed application
        run: >-
          node scripts/smoke-production.mjs
          "${{ steps.deploy.outputs.deployment-url }}"
          "${{ inputs.sha }}"

      - name: Record deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "### LiveTrafficStan production deployment"
            echo
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag rollback requirement
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Deployment completed but smoke failed. Distinguish a provider outage from a release regression; for a release regression, restore the recorded prior Cloudflare version and rerun the smoke."
