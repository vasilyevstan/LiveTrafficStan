name: Deploy production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main commit SHA to deploy
        required: true
        type: string
      artifact:
        description: Application or one-time PWA retirement artifact
        required: true
        default: application
        type: choice
        options:
          - application
          - pwa-retirement
      aircraft_photo_enabled:
        description: Enable direct Planespotters aircraft photos in the client
        required: true
        default: false
        type: boolean
      aircraft_delivery:
        description: Aircraft delivery path used by the browser
        required: true
        default: worker-proxy
        type: choice
        options:
          - worker-proxy
          - oci-private-relay
          - adsb-lol-direct
      flight_route_enabled:
        description: Enable direct ADSB.lol plausible-route lookup
        required: true
        default: true
        type: boolean
      orbital_catalog_enabled:
        description: Enable the scheduled CelesTrak orbital catalog
        required: true
        default: false
        type: boolean
      starlink_catalog_enabled:
        description: Enable the scheduled CelesTrak Starlink sample
        required: true
        default: false
        type: boolean
      marine_supplement_enabled:
        description: Enable AISStream and Open Waters alongside Digitraffic
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      WRANGLER_SEND_METRICS: false

    steps:
      - name: Validate deployment request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
          ORBITAL_ENABLED: ${{ inputs.orbital_catalog_enabled }}
          STARLINK_ENABLED: ${{ inputs.starlink_catalog_enabled }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deployments must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The deployment SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi
          if [[ "$STARLINK_ENABLED" == "true" && "$ORBITAL_ENABLED" != "true" ]]; then
            echo "The Starlink catalog requires the curated orbital catalog." >&2
            exit 1
          fi

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Verify deployment credentials
        env:
          AIRCRAFT_DELIVERY: ${{ inputs.aircraft_delivery }}
          AIRCRAFT_RELAY_AUTH_TOKEN: ${{ secrets.AIRCRAFT_RELAY_AUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARINE_ENABLED: ${{ inputs.marine_supplement_enabled }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          OPENWATERS_AIS_TOKEN: ${{ secrets.OPENWATERS_AIS_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          if [[ "$AIRCRAFT_DELIVERY" == "oci-private-relay" ]]; then
            test "${#AIRCRAFT_RELAY_AUTH_TOKEN}" -ge 32
          fi
          if [[ "$MARINE_ENABLED" == "true" ]]; then
            test -n "$AISSTREAM_API_KEY"
            test -n "$OPENWATERS_AIS_TOKEN"
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Check vessel photos
        run: npm run check:vessel-photos

      - name: Check orbital catalog
        run: npm run check:orbital-catalog

      - name: Check orbital enrichment
        run: npm run check:orbital-enrichment

      - name: Check Starlink catalog
        if: inputs.starlink_catalog_enabled
        run: npm run check:starlink-catalog -- --require-bootstrap

      - name: Build application
        if: inputs.artifact == 'application'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
          VITE_MARINE_SUPPLEMENT_ENABLED: ${{ inputs.marine_supplement_enabled }}
        run: npm run build

      - name: Build PWA retirement artifact
        if: inputs.artifact == 'pwa-retirement'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
          VITE_MARINE_SUPPLEMENT_ENABLED: ${{ inputs.marine_supplement_enabled }}
        run: npm run build:pwa-retire

      - name: Check exact deployment bundle
        run: npm run check:deploy

      - name: Resolve orbital KV namespace
        id: orbital-kv
        if: inputs.orbital_catalog_enabled
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/resolve-orbital-kv.mjs

      - name: Prepare exact Wrangler configuration
        env:
          NAMESPACE_ID: ${{ steps.orbital-kv.outputs.namespace-id }}
          ORBITAL_ENABLED: ${{ inputs.orbital_catalog_enabled }}
          STARLINK_ENABLED: ${{ inputs.starlink_catalog_enabled }}
          MARINE_ENABLED: ${{ inputs.marine_supplement_enabled }}
        run: |
          if [[ "$ORBITAL_ENABLED" == "true" ]]; then
            node scripts/prepare-wrangler-config.mjs \
              --input wrangler.jsonc \
              --output "$RUNNER_TEMP/wrangler-production.jsonc" \
              --orbital-enabled true \
              --starlink-enabled "$STARLINK_ENABLED" \
              --marine-enabled "$MARINE_ENABLED" \
              --namespace-id "$NAMESPACE_ID"
          else
            node scripts/prepare-wrangler-config.mjs \
              --input wrangler.jsonc \
              --output "$RUNNER_TEMP/wrangler-production.jsonc" \
              --orbital-enabled false \
              --starlink-enabled false \
              --marine-enabled "$MARINE_ENABLED"
          fi

      - name: Check exact production Worker configuration
        env:
          AIRCRAFT_DELIVERY: ${{ inputs.aircraft_delivery }}
          ORBITAL_ENABLED: ${{ inputs.orbital_catalog_enabled }}
          RELEASE_SHA: ${{ inputs.sha }}
          STARLINK_ENABLED: ${{ inputs.starlink_catalog_enabled }}
          MARINE_ENABLED: ${{ inputs.marine_supplement_enabled }}
        run: >-
          npx wrangler deploy
          --dry-run
          --config "$RUNNER_TEMP/wrangler-production.jsonc"
          --var "RELEASE_SHA:$RELEASE_SHA"
          --var "AIRCRAFT_DELIVERY:$AIRCRAFT_DELIVERY"
          --var "ORBITAL_CATALOG_ENABLED:$ORBITAL_ENABLED"
          --var "STARLINK_CATALOG_ENABLED:$STARLINK_ENABLED"
          --var "MARINE_SUPPLEMENT_ENABLED:$MARINE_ENABLED"
          --outdir "$RUNNER_TEMP/worker-dry-run"

      - name: Prepare production secrets file
        if: inputs.aircraft_delivery == 'oci-private-relay' || inputs.marine_supplement_enabled
        env:
          AIRCRAFT_DELIVERY: ${{ inputs.aircraft_delivery }}
          AIRCRAFT_RELAY_AUTH_TOKEN: ${{ secrets.AIRCRAFT_RELAY_AUTH_TOKEN }}
          MARINE_ENABLED: ${{ inputs.marine_supplement_enabled }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          OPENWATERS_AIS_TOKEN: ${{ secrets.OPENWATERS_AIS_TOKEN }}
          SECRETS_FILE: ${{ runner.temp }}/wrangler-production-secrets.json
        run: |
          umask 077
          node scripts/prepare-production-secrets.mjs

      - name: Deploy exact source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            git fetch --no-tags origin main
            test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
            test "$(git rev-parse origin/main)" = "${{ inputs.sha }}"
          command: >-
            deploy
            --config ${{ runner.temp }}/wrangler-production.jsonc
            --var RELEASE_SHA:${{ inputs.sha }}
            --var AIRCRAFT_DELIVERY:${{ inputs.aircraft_delivery }}
            --var ORBITAL_CATALOG_ENABLED:${{ inputs.orbital_catalog_enabled }}
            --var STARLINK_CATALOG_ENABLED:${{ inputs.starlink_catalog_enabled }}
            --var MARINE_SUPPLEMENT_ENABLED:${{ inputs.marine_supplement_enabled }}
            ${{ (inputs.aircraft_delivery == 'oci-private-relay' || inputs.marine_supplement_enabled) && format('--secrets-file {0}/wrangler-production-secrets.json', runner.temp) || '' }}

      - name: Remove production secrets file
        if: always() && (inputs.aircraft_delivery == 'oci-private-relay' || inputs.marine_supplement_enabled)
        env:
          SECRETS_FILE: ${{ runner.temp }}/wrangler-production-secrets.json
        run: rm -f "$SECRETS_FILE"

      - name: Smoke deployed application
        run: >-
          node scripts/smoke-production.mjs
          "${{ steps.deploy.outputs.deployment-url }}"
          "${{ inputs.sha }}"
          "${{ inputs.aircraft_delivery }}"
          "${{ inputs.orbital_catalog_enabled }}"
          "${{ inputs.starlink_catalog_enabled }}"

      - name: Record deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "### LiveTrafficStan production deployment"
            echo
            echo "- SHA: \`$RELEASE_SHA\`"
            echo "- Artifact: \`${{ inputs.artifact }}\`"
            echo "- Aircraft delivery: \`${{ inputs.aircraft_delivery }}\`"
            echo "- Aircraft photos enabled: \`${{ inputs.aircraft_photo_enabled }}\`"
            echo "- Flight route lookup enabled: \`${{ inputs.flight_route_enabled }}\`"
            echo "- Orbital catalog enabled: \`${{ inputs.orbital_catalog_enabled }}\`"
            echo "- Starlink catalog enabled: \`${{ inputs.starlink_catalog_enabled }}\`"
            echo "- Marine supplement enabled: \`${{ inputs.marine_supplement_enabled }}\`"
            echo "- Orbital KV namespace: \`${{ steps.orbital-kv.outputs.namespace-id || 'none' }}\`"
            echo "- Orbital coordinator enabled: \`${{ inputs.orbital_catalog_enabled }}\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag rollback requirement
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "::error::Deployment completed but smoke failed. Distinguish a provider outage from a release regression; for a release regression, restore the recorded prior Cloudflare version and rerun the smoke."
