name: Roll back production

on:
  workflow_dispatch:
    inputs:
      current_main_sha:
        description: Exact current main SHA authorizing this rollback
        required: true
        type: string
      target_sha:
        description: Exact source SHA represented by the target Cloudflare version
        required: true
        type: string
      target_version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      deployment_url:
        description: Exact public production URL to smoke after rollback
        required: true
        type: string
      artifact:
        description: Application or one-time PWA retirement artifact in the target version
        required: true
        default: application
        type: choice
        options:
          - application
          - pwa-retirement
      aircraft_photo_enabled:
        description: Aircraft-photo build flag used by the target version
        required: true
        default: false
        type: boolean
      aircraft_delivery:
        description: Aircraft delivery path used by the target version
        required: true
        default: worker-proxy
        type: choice
        options:
          - worker-proxy
          - adsb-lol-direct
      flight_route_enabled:
        description: Flight-route build flag used by the target version
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ inputs.deployment_url }}
    env:
      WRANGLER_SEND_METRICS: false

    steps:
      - name: Validate rollback request
        env:
          CURRENT_MAIN_SHA: ${{ inputs.current_main_sha }}
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production rollbacks must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The current main SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The target SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi
          if [[ ! "$TARGET_VERSION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "The target Cloudflare version ID is invalid." >&2
            exit 1
          fi
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[A-Za-z0-9.-]+/?$ ]]; then
            echo "The deployment URL must be an HTTPS origin without a path." >&2
            exit 1
          fi

      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.current_main_sha }}
          fetch-depth: 0

      - name: Verify current main and rollback ancestry
        env:
          CURRENT_MAIN_SHA: ${{ inputs.current_main_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
          test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "$CURRENT_MAIN_SHA"

      - name: Preserve current smoke policy and check out target source
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          cp scripts/smoke-production.mjs "$RUNNER_TEMP/smoke-production.mjs"
          cp scripts/smoke-policy.mjs "$RUNNER_TEMP/smoke-policy.mjs"
          git checkout --detach "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install target dependencies
        run: npm ci

      - name: Build target application
        if: inputs.artifact == 'application'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
        run: npm run build

      - name: Build target PWA retirement artifact
        if: inputs.artifact == 'pwa-retirement'
        env:
          VITE_AIRCRAFT_ENDPOINT: ${{ inputs.aircraft_delivery == 'adsb-lol-direct' && 'https://api.adsb.lol' || '/api/aircraft' }}
          VITE_AIRCRAFT_PHOTO_ENABLED: ${{ inputs.aircraft_photo_enabled }}
          VITE_FLIGHT_ROUTE_ENABLED: ${{ inputs.flight_route_enabled }}
        run: npm run build:pwa-retire

      - name: Check exact rollback bundle
        run: >-
          npm run check:deploy --
          --var AVIATIONSTACK_ENABLED:${{ inputs.flight_route_enabled }}

      - name: Restore current smoke policy
        run: |
          cp "$RUNNER_TEMP/smoke-production.mjs" scripts/smoke-production.mjs
          cp "$RUNNER_TEMP/smoke-policy.mjs" scripts/smoke-policy.mjs

      - name: Roll back Cloudflare version
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: >-
          npx wrangler rollback "$TARGET_VERSION_ID"
          --name livetrafficstan
          --message "GitHub rollback to $TARGET_SHA"
          --yes

      - name: Smoke rolled-back application
        run: >-
          node scripts/smoke-production.mjs
          "${{ inputs.deployment_url }}"
          "${{ inputs.target_sha }}"
          "${{ inputs.aircraft_delivery }}"

      - name: Record rollback
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION_ID: ${{ inputs.target_version_id }}
        run: |
          {
            echo "### LiveTrafficStan production rollback"
            echo
            echo "- Target SHA: \`$TARGET_SHA\`"
            echo "- Target Cloudflare version: \`$TARGET_VERSION_ID\`"
            echo "- Artifact: \`${{ inputs.artifact }}\`"
            echo "- Aircraft delivery: \`${{ inputs.aircraft_delivery }}\`"
            echo "- Aircraft photos enabled: \`${{ inputs.aircraft_photo_enabled }}\`"
            echo "- Flight route lookup enabled: \`${{ inputs.flight_route_enabled }}\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
