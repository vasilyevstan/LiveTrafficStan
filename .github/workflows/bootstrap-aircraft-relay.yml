name: Bootstrap aircraft relay transport

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current main commit SHA containing the bootstrap workflow
        required: true
        type: string
      recipient_public_key:
        description: Base64-encoded RSA public key used to encrypt the one-time tunnel token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aircraft-relay-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      TUNNEL_NAME: livetrafficstan-aircraft-relay
      VPC_SERVICE_NAME: livetrafficstan-aircraft-relay

    steps:
      - name: Validate bootstrap request
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Relay bootstrap must use the main workflow." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The bootstrap SHA must be 40 lowercase hex characters." >&2
            exit 1
          fi

      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify current main
        env:
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: Create or verify private transport
        id: bootstrap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$RECIPIENT_PUBLIC_KEY"

          temporary_directory="$(mktemp -d)"
          cleanup() {
            rm -f \
              "$temporary_directory/api-response.json" \
              "$temporary_directory/request.json" \
              "$temporary_directory/recipient.pem"
            rmdir "$temporary_directory" 2>/dev/null || true
          }
          trap cleanup EXIT

          api_response="$temporary_directory/api-response.json"
          request_body="$temporary_directory/request.json"
          artifact_directory="$(mktemp -d \
            "$RUNNER_TEMP/cloudflare-aircraft-relay-bootstrap.XXXXXX")"
          chmod 0700 "$artifact_directory"

          api_request() {
            local method="$1"
            local path="$2"
            local body="${3:-}"

            local -a arguments=(
              --fail
              --silent
              --show-error
              --request "$method"
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
              --header 'Content-Type: application/json'
              --output "$api_response"
            )
            if [[ -n "$body" ]]; then
              arguments+=(--data-binary "@$body")
            fi
            curl "${arguments[@]}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/$path"
            jq -e '.success == true' "$api_response" >/dev/null ||
              {
                echo "Cloudflare API rejected $method $path." >&2
                exit 1
              }
          }

          api_request GET "cfd_tunnel?name=$TUNNEL_NAME&is_deleted=false"
          tunnel_count="$(jq --arg name "$TUNNEL_NAME" \
            '[.result[] | select(.name == $name and .deleted_at == null)] | length' \
            "$api_response")"
          if [[ "$tunnel_count" == 0 ]]; then
            jq -n --arg name "$TUNNEL_NAME" \
              '{name: $name, config_src: "cloudflare"}' >"$request_body"
            api_request POST 'cfd_tunnel' "$request_body"
            tunnel_id="$(jq -er '.result.id' "$api_response")"
          elif [[ "$tunnel_count" == 1 ]]; then
            tunnel_id="$(jq -er --arg name "$TUNNEL_NAME" \
              '.result[] | select(.name == $name and .deleted_at == null) | .id' \
              "$api_response")"
            remote_config="$(jq -er --arg name "$TUNNEL_NAME" \
              '.result[] | select(.name == $name and .deleted_at == null) | .remote_config' \
              "$api_response")"
            test "$remote_config" = true
          else
            echo "More than one active tunnel has the required name." >&2
            exit 1
          fi
          [[ "$tunnel_id" =~ ^[0-9a-f-]{36}$ ]]

          api_request GET 'connectivity/directory/services'
          service_count="$(jq --arg name "$VPC_SERVICE_NAME" \
            '[.result[] | select(.name == $name)] | length' \
            "$api_response")"
          if [[ "$service_count" == 0 ]]; then
            jq -n \
              --arg name "$VPC_SERVICE_NAME" \
              --arg tunnel_id "$tunnel_id" \
              '{
                type: "http",
                name: $name,
                http_port: 8788,
                host: {
                  ipv4: "127.0.0.1",
                  network: {tunnel_id: $tunnel_id}
                }
              }' >"$request_body"
            api_request POST 'connectivity/directory/services' "$request_body"
            service_id="$(jq -er '.result.service_id' "$api_response")"
          elif [[ "$service_count" == 1 ]]; then
            service="$(jq -c --arg name "$VPC_SERVICE_NAME" \
              '.result[] | select(.name == $name)' \
              "$api_response")"
            jq -e \
              --arg tunnel_id "$tunnel_id" \
              '
                .type == "http" and
                .http_port == 8788 and
                (.https_port == null) and
                .host.ipv4 == "127.0.0.1" and
                .host.network.tunnel_id == $tunnel_id
              ' <<<"$service" >/dev/null ||
              {
                echo "The existing VPC Service does not match the fail-closed relay configuration." >&2
                exit 1
              }
            service_id="$(jq -er '.service_id' <<<"$service")"
          else
            echo "More than one VPC Service has the required name." >&2
            exit 1
          fi
          [[ "$service_id" =~ ^[0-9a-f-]{36}$ ]]

          api_request GET "cfd_tunnel/$tunnel_id/token"
          tunnel_token="$(jq -er '.result' "$api_response")"
          [[ "${#tunnel_token}" -ge 32 ]]
          printf '%s' "$RECIPIENT_PUBLIC_KEY" |
            base64 --decode >"$temporary_directory/recipient.pem"
          openssl pkey \
            -pubin \
            -in "$temporary_directory/recipient.pem" \
            -noout
          printf '%s' "$tunnel_token" |
            openssl pkeyutl \
              -encrypt \
              -pubin \
              -inkey "$temporary_directory/recipient.pem" \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 \
              -pkeyopt rsa_mgf1_md:sha256 \
              -out "$artifact_directory/cloudflare-tunnel-token.enc"
          unset tunnel_token

          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg tunnelName "$TUNNEL_NAME" \
            --arg tunnelId "$tunnel_id" \
            --arg serviceName "$VPC_SERVICE_NAME" \
            --arg serviceId "$service_id" \
            '{
              sourceSha: $sourceSha,
              tunnelName: $tunnelName,
              tunnelId: $tunnelId,
              serviceName: $serviceName,
              serviceId: $serviceId,
              protocol: "http",
              host: "127.0.0.1",
              port: 8788
            }' >"$artifact_directory/transport.json"

          echo "tunnel-id=$tunnel_id" >>"$GITHUB_OUTPUT"
          echo "service-id=$service_id" >>"$GITHUB_OUTPUT"
          echo "artifact-directory=$artifact_directory" >>"$GITHUB_OUTPUT"

      - name: Upload encrypted tunnel handoff
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-aircraft-relay-bootstrap-${{ inputs.sha }}
          path: ${{ steps.bootstrap.outputs.artifact-directory }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove encrypted tunnel handoff from runner
        if: always()
        env:
          ARTIFACT_DIRECTORY: ${{ steps.bootstrap.outputs.artifact-directory }}
        run: |
          if [[ -z "$ARTIFACT_DIRECTORY" ]] ||
            [[ "$ARTIFACT_DIRECTORY" != "$RUNNER_TEMP"/cloudflare-aircraft-relay-bootstrap.* ]]; then
            exit 0
          fi
          rm -f \
            "$ARTIFACT_DIRECTORY/cloudflare-tunnel-token.enc" \
            "$ARTIFACT_DIRECTORY/transport.json"
          rmdir "$ARTIFACT_DIRECTORY" 2>/dev/null || true

      - name: Record bootstrap
        env:
          TUNNEL_ID: ${{ steps.bootstrap.outputs.tunnel-id }}
          SERVICE_ID: ${{ steps.bootstrap.outputs.service-id }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "### LiveTrafficStan private aircraft transport"
            echo
            echo "- Source SHA: \`$SOURCE_SHA\`"
            echo "- Tunnel: \`$TUNNEL_ID\`"
            echo "- VPC Service: \`$SERVICE_ID\`"
            echo "- Origin: \`http://127.0.0.1:8788\`"
            echo "- Tunnel token: encrypted artifact with one-day retention"
          } >>"$GITHUB_STEP_SUMMARY"
