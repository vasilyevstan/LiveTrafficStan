name: Validation

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Check aircraft metadata
        run: npm run check:aircraft-metadata

      - name: Check ports
        run: npm run check:ports

      - name: Check airports
        run: npm run check:airports

      - name: Build
        run: npm run build

      - name: Check deployment bundle
        run: npm run check:deploy
        env:
          WRANGLER_SEND_METRICS: false
